spring.application.name=AIGrievanceSystem
# Load root .env for local development; environment variables still take precedence.
spring.config.import=optional:file:.env[.properties]
server.port=${PORT:8080}

spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o-mini

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}

spring.datasource.url=jdbc:h2:mem:aigrievancedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.error.whitelabel.enabled=false
server.error.include-message=always
server.error.include-binding-errors=always

springdoc.swagger-ui.path=/swagger